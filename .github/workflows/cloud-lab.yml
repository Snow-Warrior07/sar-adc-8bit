name: Online engineering lab
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Engineering stages to execute
        default: all
        options: [all, circuits, timing]
permissions:
  contents: read
jobs:
  engineering:
    if: inputs.mode != 'timing'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source circuit and RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice iverilog yosys
          python -m pip install -r requirements.txt
      - name: Reference tests
        run: python -m pytest -q
      - name: Run online circuit measurements
        run: python -m tools.cloud_spice
      - name: Run RTL verification
        run: |
          python -m tools.verify_rtl --quick
          python -m tools.verify_variants
      - name: Synthesize and analyze timing
        run: python -m tools.synthesize --no-sta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-evidence
          path: |
            results/
            build/*.log
            build/*.json
            build/*.v
            build/*.sdc
  timing:
    if: inputs.mode != 'circuits'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned OpenSTA and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys cmake g++ tcl-dev libeigen3-dev swig bison flex libfl-dev zlib1g-dev libfmt-dev libgtest-dev autoconf automake libtool
          python -m pip install numpy PyYAML
          mkdir -p .tools
          git clone --depth 1 --branch 3.0.0 https://github.com/cuddorg/cudd.git .tools/cudd
          cd .tools/cudd
          autoreconf -fi
          ./configure --prefix="$GITHUB_WORKSPACE/.tools/cudd-install"
          make -j4
          make install
          cd "$GITHUB_WORKSPACE"
          git clone https://github.com/The-OpenROAD-Project/OpenSTA.git .tools/OpenSTA
          git -C .tools/OpenSTA checkout 0f2529d18218b87aa0e82de444395a830d5058a1
          cmake -S .tools/OpenSTA -B .tools/OpenSTA/build -DCMAKE_BUILD_TYPE=Release -DFLEX_INCLUDE_DIR=/usr/include -DCUDD_DIR="$GITHUB_WORKSPACE/.tools/cudd-install"
          cmake --build .tools/OpenSTA/build -j4
          sudo install .tools/OpenSTA/build/sta /usr/local/bin/sta
      - name: Constrained SKY130 synthesis and timing
        run: python -m tools.synthesize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-evidence
          path: |
            results/synthesis/
            results/phases/phase-08.json
            build/*.log
            build/*.json
            build/*.v
            build/*.sdc
            constraints/
